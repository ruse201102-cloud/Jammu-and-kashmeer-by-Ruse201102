<h1 style="font-size: 30px;text-align: center;">Payment/Purchase</h1>






<h1 style="text-align:center;">Booking Details</h1>
<center style="color:red">ALERT!! The booking will be forewarded to one of our associates, and will reach out to you witthin 3 days for booking confirmation via email/phone call.</center>
<br>
<form style="width:60%; margin:auto; padding:20px; border:2px solid black; border-radius:10px;">

    <h2>Personal Information</h2>

    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your name" required style="width:95%;padding:10px;">
    <br><br>

    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter phone number" required style="width:95%;padding:10px;">
    <br><br>

    <label>Email Address:</label><br>
    <input type="email" placeholder="Enter your email" required style="width:95%;padding:10px;">
    <br><br>

    <label>Location:</label><br>
    <input type="text" placeholder="Enter your city" required style="width:95%;padding:10px;">
    <br><br>

    <hr>

    <h2>Travel Information</h2>

    <label>Select Package:</label><br>
    <select required style="width:98%;padding:10px;">
        <option value="">Choose a package</option>
        <option>Kashmir Explorer</option>
        <option>Mountain Escape</option>
        <option>Grand Kashmir Tour</option>
    </select>
    <br><br>

    <label>Select Plan Tier:</label><br>
    <select required style="width:98%;padding:10px;">
        <option value="">Choose a plan</option>
        <option>Bronze</option>
        <option>Iron</option>
        <option>Gold</option>
    </select>
    <br><br>

    <label>Number of Travellers:</label><br>
    <input type="number" min="1" max="20" value="1" required style="width:95%;padding:10px;">
    <br><br>

    <label>Travel Date:</label><br>
    <input type="date" required style="width:95%;padding:10px;">
    <br><br>

    <input type="submit" value="Proceed to Payment" style="padding:12px 25px;background-color:black;color:white;border:none;border-radius:5px;">

</form>



    </body>
